# ── HTTP ─────────────────────────────────────────────────────────────────────
quarkus.http.port=8081

# ── JWT (verify tokens issued by the monolith) ───────────────────────────────
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=personal-library-manager

# ── Kafka consumer ────────────────────────────────────────────────────────────
mp.messaging.incoming.domain-events-in.connector=smallrye-kafka
mp.messaging.incoming.domain-events-in.topic=domain-events
mp.messaging.incoming.domain-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.domain-events-in.group.id=recommendation-service
mp.messaging.incoming.domain-events-in.auto.offset.reset=earliest
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ── OpenAI REST client ────────────────────────────────────────────────────────
quarkus.rest-client.openai.url=https://api.openai.com
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.max-tokens=${OPENAI_MAX_TOKENS:300}

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.library".level=DEBUG

# ── Health ────────────────────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/q/health
