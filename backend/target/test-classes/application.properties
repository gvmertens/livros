# ── Test datasource — overridden by Testcontainers @QuarkusTestResource ──────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=test
quarkus.datasource.password=test
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/test

# ── Flyway ───────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true

# ── Hibernate ────────────────────────────────────────────────────────────────
quarkus.hibernate-orm.log.sql=true

# ── JWT ──────────────────────────────────────────────────────────────────────
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=personal-library-manager
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# ── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.level=WARN
quarkus.log.category."com.library".level=DEBUG

# ── JaCoCo (quarkus-jacoco extension) ────────────────────────────────────────
# quarkus-jacoco writes coverage data here; the JaCoCo Maven plugin reads it
# for the report and check goals. The standard Maven JaCoCo agent is disabled
# in pom.xml to avoid double-instrumentation with QuarkusClassLoader.
quarkus.jacoco.data-file=target/jacoco-quarkus.exec
quarkus.jacoco.reuse-data-file=true
