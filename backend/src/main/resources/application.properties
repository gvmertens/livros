# ── Datasource ──────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:library}
quarkus.datasource.password=${DB_PASSWORD:library}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/library}

# ── Flyway ───────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ── Hibernate ORM ────────────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ── JWT (SmallRye) ───────────────────────────────────────────────────────────
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=personal-library-manager
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# ── HTTP ─────────────────────────────────────────────────────────────────────
quarkus.http.port=8080

# ── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) [%X{correlationId}] %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.library".level=DEBUG

# ── Health ───────────────────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/q/health

# ── OpenAPI / Swagger UI ─────────────────────────────────────────────────────
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi

# Google Books catalog
google-books.enabled=${GOOGLE_BOOKS_ENABLED:true}
google-books.base-url=${GOOGLE_BOOKS_BASE_URL:https://www.googleapis.com/books/v1}
google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
google-books.max-results=${GOOGLE_BOOKS_MAX_RESULTS:20}
google-books.default-language=${GOOGLE_BOOKS_LANGUAGE:pt}
google-books.connect-timeout=${GOOGLE_BOOKS_CONNECT_TIMEOUT:5000}
google-books.read-timeout=${GOOGLE_BOOKS_READ_TIMEOUT:10000}
quarkus.rest-client.google-books.url=${GOOGLE_BOOKS_BASE_URL:https://www.googleapis.com/books/v1}
quarkus.rest-client.google-books.connect-timeout=${GOOGLE_BOOKS_CONNECT_TIMEOUT:5000}
quarkus.rest-client.google-books.read-timeout=${GOOGLE_BOOKS_READ_TIMEOUT:10000}

# ── Kafka (KafkaEventBus @Alternative) ───────────────────────────────────────
# Set KAFKA_BOOTSTRAP_SERVERS env var to activate KafkaEventBus.
# When unset, the InProcessEventBus (CDI default) is used instead.
%prod.mp.messaging.outgoing.domain-events-out.connector=smallrye-kafka
%prod.mp.messaging.outgoing.domain-events-out.topic=domain-events
%prod.mp.messaging.outgoing.domain-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
%prod.mp.messaging.outgoing.domain-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
